<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <g transform="translate(100, 100)">
    <!-- Speech bubble -->
    <path d="M-45,-25 Q-45,-45 -25,-45 L25,-45 Q45,-45 45,-25 L45,30 Q45,50 25,50 L-15,50 L-5,65 L-15,50 L-45,50 Q-45,30 -45,25 Z" fill="url(#fg)" opacity="0.95"/>
    <!-- Dollar sign -->
    <text x="0" y="12" font-family="system-ui, sans-serif" font-size="54" font-weight="700" fill="#0ea5e9" text-anchor="middle" dominant-baseline="middle">$</text>
    <!-- Small dots for "finance" feel -->
    <circle cx="-30" cy="-18" r="3" fill="#6366f1" opacity="0.7"/>
    <circle cx="30" cy="-18" r="3" fill="#6366f1" opacity="0.7"/>
    <circle cx="0" cy="22" r="2.5" fill="#6366f1" opacity="0.5"/>
  </g>
</svg>